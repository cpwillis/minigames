name = "minigames-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

# custom_domain = true makes Cloudflare create and manage the DNS record automatically.
# A plain zone route does NOT create DNS, which is why api.minigames.cpwillis.dev never resolved.
routes = [
  { pattern = "api.minigames.cpwillis.dev", custom_domain = true }
]

# This file is the source of truth: the dashboard inherits whatever is set here on deploy.
# `enabled` is the master switch for observability. It was false while [observability.logs]
# said enabled = true, which meant no logs were persisted at all and the console.error in
# app.onError went nowhere. Logs land in Workers & Pages -> minigames-api -> Logs.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# Traces cost extra and this worker has four routes; logs are enough. Flip enabled to turn on,
# and set head_sampling_rate well below 1 if traffic ever justifies it.
[observability.traces]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "minigames-db"
# Local dev (`npm run dev`) ignores this id and uses a local SQLite file under .wrangler/.
database_id = "142bbafd-2e73-486c-a914-f93d1b84de83"
